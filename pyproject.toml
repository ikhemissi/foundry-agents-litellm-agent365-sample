[project]
name = "foundry-agents-litellm-agent365-sample"
version = "0.1.0"
description = "Foundry hosted and prompt agents using models, MCP servers and an A2A 1.0 agent through LiteLLM, governed by Agent 365."
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "openai>=3.42.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
