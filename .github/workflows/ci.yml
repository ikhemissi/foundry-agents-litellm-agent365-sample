# Continuous integration: the sample's own checks (AGENTS.md, "Checks") on every push to main and every pull request.
# No secrets and no Azure access: the Terraform modules are tested with mock providers. Third-party actions are pinned
# to commit SHAs (version in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python version each part runs on: its Dockerfile, azure.yaml or pyproject.toml.
          - path: services/trips-mcp
            python: "3.12"
            requirements: --with-requirements requirements.txt --with-requirements requirements-dev.txt
          - path: agents/travel-assistant
            python: "3.13"
            requirements: --with-requirements requirements.txt --with-requirements requirements-dev.txt
          - path: agents/expense-policy
            python: "3.12"
            requirements: --with-requirements requirements-dev.txt
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Lint and format
        run: uvx ruff check . && uvx ruff format --check .
      - name: Tests
        env:
          PYTHON: ${{ matrix.python }}
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          read -ra requirements <<< "$REQUIREMENTS"
          uv run --python "$PYTHON" --no-project "${requirements[@]}" pytest

  scripts:
    name: Python (src)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Lint and format
        run: uvx ruff check . && uvx ruff format --check .

  chat-ui:
    name: Chat UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/chat-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/chat-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Terraform format and validation (no backend, no Azure)
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: Module tests (mock providers, no Azure)
        run: |
          for module in infra/modules/*/; do
            echo "::group::$module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test
            echo "::endgroup::"
          done
      - name: Shell scripts
        run: shellcheck -x infra/hooks/*.sh infra/scripts/*.sh
