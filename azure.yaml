# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-agents-litellm-agent365-sample
requiredVersions:
  azd: ">= 1.37.0"
  extensions:
    azure.ai.agents: ">= 1.0.0"
    azure.ai.projects: ">= 1.0.0"

# One Terraform root (infra/): each file is one part of the architecture, built from the modules in infra/modules.
infra:
  provider: terraform
  path: infra

services:
  # The Foundry project (infra/foundry.tf), for the agent services below.
  foundry-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
  # Contoso's travel assistant: a hosted agent (agents/travel-assistant/main.py), deployed as code.
  travel-assistant:
    host: azure.ai.agent
    project: ./agents/travel-assistant
    language: python
    kind: hosted
    name: travel-assistant
    description: Contoso's travel assistant. Acts for the signed-in user on their trips and asks the expense policy agent over A2A 1.0, through LiteLLM.
    uses:
      - foundry-project
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      LITELLM_URL: ${LITELLM_URL}
      KEY_VAULT_URI: ${KEY_VAULT_URI}
      LITELLM_KEY_SECRET_NAME: litellm-key-travel-assistant
      MODEL: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      TRIPS_MCP_SERVER: Contoso_Trips
      EXPENSE_POLICY_A2A_AGENT: expense_policy_agent
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      OTEL_SERVICE_NAME: travel-assistant
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    hooks:
      postdeploy:
        posix:
          shell: sh
          run: bash ../../infra/scripts/grant-travel-assistant.sh
  trips-mcp:
    project: ./services/trips-mcp
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      # Images are built in the platform's registry: no local Docker needed to deploy.
      remoteBuild: true
  chat-ui:
    project: ./services/chat-ui
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      # Images are built in the platform's registry: no local Docker needed to deploy.
      remoteBuild: true

# Project-level hooks (infra/hooks/): what Terraform cannot do, before and after it runs.
hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/preprovision.sh
      interactive: false
      continueOnError: false
  postprovision:
    posix:
      shell: sh
      run: bash ./infra/hooks/postprovision.sh
      interactive: false
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: bash ./infra/hooks/postdeploy.sh
      interactive: false
      continueOnError: false
  predown:
    posix:
      shell: sh
      run: bash ./infra/hooks/predown.sh
      interactive: false
      continueOnError: false
